<h1>EVE Librarian</h1>
<p>EVE Librarian is a personal, single-user tool. It lets its owner's own server organise and index documents in the owner's own Google Drive.</p>
<p>It is not a public service: nobody else can sign up, and it never accesses anyone else's account.</p>
<p><a href="privacy.html">Privacy notice</a></p>
